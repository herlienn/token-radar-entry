<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Token Radar (radar-2): 198 pre-token protocols ranked by implied value, with a farm plan for each.">
<title>Token Radar: pre-token protocols ranked by implied value</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<a class="skip" href="#board">Skip to the board</a>
<main id="board" tabindex="-1" aria-busy="true"></main>
<!-- Top movers panel skeleton, filled by renderTopMovers in app.js. -->
<template id="top-movers-template">
  <section class="movers-panel" aria-label="Top movers (7d)">
    <h2>Top movers (7d)</h2>
    <div class="movers-cols"></div>
  </section>
</template>
<!-- Chain breakdown skeleton, filled by renderChainBreakdown in app.js. -->
<template id="chain-breakdown-template">
  <section class="chains-panel" aria-label="Chains">
    <h2>Chains</h2>
    <p class="sub">Top 8 chains by total implied value, from the rows shown above. Each protocol counts on its first listed chain. Click a chain to filter the board to it.</p>
    <div class="chains-cols"></div>
  </section>
</template>
<script src="../data.js"></script>
<script src="app.js"></script>
</body>
</html>
